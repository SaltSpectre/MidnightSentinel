[package]
name = "midsent-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "midsent_overlay"
path = "src/lib.rs"

[[bin]]
name = "midsentcli"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
embed-resource = "3.0"
