name: Build and Release

on:
    pull_request:
      branches: [ main ]
    workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      msi_version: ${{ steps.version.outputs.MSI_VERSION }}
      tag: ${{ steps.version.outputs.TAG }}
    steps:
    - name: Generate version
      id: version
      run: |
        date=$(date '+%y.%-m.%-d')
        runNumber=${GITHUB_RUN_NUMBER:-0}
        version="$date+$runNumber"
        msi_version="$date.$runNumber"
        echo "VERSION=$version" >> $GITHUB_OUTPUT
        echo "MSI_VERSION=$msi_version" >> $GITHUB_OUTPUT
        echo "TAG=v$version" >> $GITHUB_OUTPUT
        echo "Generated version: $version"
        echo "Generated MSI version: $msi_version"

  build-msi:
    needs: generate-version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.rust_target }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Stamp version into Cargo.toml
      shell: pwsh
      run: |
        $version = "${{ needs.generate-version.outputs.version }}"
        (Get-Content "src/Cargo.toml") -replace 'version = "[^"]*"', "version = `"$version`"" | Set-Content "src/Cargo.toml"

    - name: Build application
      run: cargo build --release --workspace --target ${{ matrix.rust_target }} --manifest-path src/Cargo.toml

    - name: Stage published files
      shell: pwsh
      run: |
        $stageDir = "publish/${{ matrix.arch }}"
        New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
        $binDir = "src/target/${{ matrix.rust_target }}/release"
        Copy-Item "$binDir/midsent.exe" $stageDir
        Copy-Item "$binDir/midsentcli.exe" $stageDir

    - name: Build MSI
      run: dotnet build installer/MidnightSentinel.Installer.wixproj --configuration Release -p:Platform=${{ matrix.arch }} -p:Version=${{ needs.generate-version.outputs.msi_version }}

    - name: Rename MSI
      run: |
        $version = "${{ needs.generate-version.outputs.version }}"
        $arch = "${{ matrix.arch }}"
        Copy-Item "installer/bin/$arch/Release/MidnightSentinel-$arch.msi" "MidnightSentinel-$arch-$version.msi"
        echo "MSI_NAME=MidnightSentinel-$arch-$version.msi" >> $env:GITHUB_ENV

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v7
      with:
        name: MidnightSentinel-${{ matrix.arch }}-msi
        path: ${{ env.MSI_NAME }}
        retention-days: 90

  create-release:
    needs: [generate-version, build-msi]
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.generate-version.outputs.tag }}
        name: "🌙 Midnight Sentinel ${{ needs.generate-version.outputs.version }}"
        body: |
          *Automated release built from commit ${{ github.sha }}*
          
          ## Downloads:
          - `MidnightSentinel-x64-${{ needs.generate-version.outputs.version }}.msi` - **x64 MSI Installer** (Intel/AMD 64-bit)
          - `MidnightSentinel-arm64-${{ needs.generate-version.outputs.version }}.msi` - **ARM64 MSI Installer** (Windows on ARM64 devices and Apple silicon)
          
          ## Installation:
          Run the MSI for your architecture. The installer is per-user and does not require administrator privileges.
          
        files: artifacts/**/*
        prerelease: false
        draft: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
